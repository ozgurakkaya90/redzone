services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=RiskManagement;User=riskapp;Password=${DB_PASSWORD};CharSet=utf8mb4;"
      Jwt__Key: "${JWT_SECRET}"
      AppSettings__DemoMode: "${DEMO_MODE:-false}"
      AppSettings__UseSqlite: "false"
      AppSettings__MaxUploadSizeMb: "${MAX_UPLOAD_MB:-10}"
    volumes:
      - uploads:/app/uploads           # ethics + findings ekleri
      - logo-uploads:/app/wwwroot/uploads  # logo ve görsel varlıklar
      - dp-keys:/root/.aspnet/DataProtection-Keys  # oturum anahtarları (yeniden başlatmada geçersiz olmaz)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_change_me}"
      MYSQL_DATABASE: RiskManagement
      MYSQL_USER: riskapp
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:        # /app/uploads — ethics + findings ekleri
  logo-uploads:   # /app/wwwroot/uploads — logo + görsel varlıklar
  dp-keys:        # /root/.aspnet/DataProtection-Keys — oturum şifreleme anahtarları
