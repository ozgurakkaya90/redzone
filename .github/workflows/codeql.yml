name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 3 * * 1'
jobs:
  analyze:
    name: CodeQL Analizi
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: CodeQL baslat
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Derle
        run: dotnet build RiskManagement/RiskManagement.csproj --configuration Release
      - name: CodeQL analiz
        uses: github/codeql-action/analyze@v3
